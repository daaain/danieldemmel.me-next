<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-label="Line chart of the share of 233 successful attacks caught against audit budget from 0 to 10%, for three monitors: commands only, plus kernel evidence, and plus kernel evidence and notes. Below about 1.5% the kernel lines sit above the commands-only line; from 2% upwards the three lines run close together, with commands only slightly ahead.">
<title>Line chart of the share of 233 successful attacks caught against audit budget from 0 to 10%, for three monitors: commands only, plus kernel evidence, and plus kernel evidence and notes. Below about 1.5% the kernel lines sit above the commands-only line; from 2% upwards the three lines run close together, with commands only slightly ahead.</title>
