<svg xmlns="http://www.w3.org/2000/svg" class="ck ck-dark ck-thumb" viewBox="0 0 480 336" width="480" height="336" role="img" aria-labelledby="th-t th-d"><title id="th-t">How many attacks get caught, by audit budget</title><desc id="th-d">Line chart of the share of 233 successful attacks caught against audit budget from 0 to 10%, for three monitors: commands only, plus kernel evidence, and plus kernel evidence and notes. Below about 1.5% the kernel lines sit above the commands-only line; from 2% upwards the three lines run close together, with commands only slightly ahead</desc><style>.ck{--ck-page:#f4f4f2;--ck-surface:#fcfcfb;--ck-ink:#0b0b0b;--ck-ink2:#52514e;--ck-muted:#898781;--ck-grid:#e9e8e2;--ck-grid-v:#f0efea;--ck-axis:#c3c2b7;--ck-zero:#52514e;--ck-shade:#f2f1ec;--ck-track:#efeee9;--ck-area:.2;--ck-border:rgba(11,11,11,.09);--ck-chip:rgba(11,11,11,.13);--ck-hover:rgba(11,11,11,.05);--ck-tip-bg:#ffffff;--ck-tip-border:rgba(11,11,11,.10);--ck-shadow:rgba(11,11,11,.16);--ck-cross:#a8a79f;--ck-s1:#2a78d6;--ck-s2:#eb6834;--ck-s3:#1baf7a;--ck-s4:#eda100;--ck-s5:#e87ba4;--ck-s6:#008300;--ck-s7:#6250d6;--ck-s8:#e34948;font-family:Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;-webkit-font-smoothing:antialiased}
@media (prefers-color-scheme:dark){.ck.ck-auto{--ck-page:#121212;--ck-surface:#1e1e1d;--ck-ink:#f0efec;--ck-ink2:#c3c2b7;--ck-muted:#8f8e88;--ck-grid:#2e2e2c;--ck-grid-v:#262625;--ck-axis:#43433f;--ck-zero:#c3c2b7;--ck-shade:#252524;--ck-track:#2a2a28;--ck-area:.12;--ck-border:rgba(255,255,255,.09);--ck-chip:rgba(255,255,255,.15);--ck-hover:rgba(255,255,255,.06);--ck-tip-bg:#2a2a29;--ck-tip-border:rgba(255,255,255,.10);--ck-shadow:rgba(0,0,0,.55);--ck-cross:#5d5c57;--ck-s1:#3987e5;--ck-s2:#d95926;--ck-s3:#199e70;--ck-s4:#c98500;--ck-s5:#d55181;--ck-s6:#0ca30c;--ck-s7:#9085e9;--ck-s8:#e66767}}
html:not(.dark) .ck.ck-auto{--ck-page:#f4f4f2;--ck-surface:#fcfcfb;--ck-ink:#0b0b0b;--ck-ink2:#52514e;--ck-muted:#898781;--ck-grid:#e9e8e2;--ck-grid-v:#f0efea;--ck-axis:#c3c2b7;--ck-zero:#52514e;--ck-shade:#f2f1ec;--ck-track:#efeee9;--ck-area:.2;--ck-border:rgba(11,11,11,.09);--ck-chip:rgba(11,11,11,.13);--ck-hover:rgba(11,11,11,.05);--ck-tip-bg:#ffffff;--ck-tip-border:rgba(11,11,11,.10);--ck-shadow:rgba(11,11,11,.16);--ck-cross:#a8a79f;--ck-s1:#2a78d6;--ck-s2:#eb6834;--ck-s3:#1baf7a;--ck-s4:#eda100;--ck-s5:#e87ba4;--ck-s6:#008300;--ck-s7:#6250d6;--ck-s8:#e34948}
