<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="Line chart with a shaded band of the difference in attacks caught between kernel evidence plus notes and commands only, for audit budgets from 0 to 25%. The line starts about 20 attacks above zero below 1%, then hovers a few attacks below zero; the 95% band includes zero throughout.">
