<svg xmlns="http://www.w3.org/2000/svg" class="ck ck-light ck-thumb" viewBox="0 0 480 336" width="480" height="336" role="img" aria-labelledby="th-t th-d"><title id="th-t">Writing speed: in memory vs streamed from SSD</title><desc id="th-d">Line chart of writing speed with resident and streamed lines for both models: DeepSeek streamed converges towards resident, while GLM streamed stays about a fifth below GLM resident from 16K onwards</desc><style>.ck{--ck-page:#f4f4f2;--ck-surface:#fcfcfb;--ck-ink:#0b0b0b;--ck-ink2:#52514e;--ck-muted:#898781;--ck-grid:#e9e8e2;--ck-grid-v:#f0efea;--ck-axis:#c3c2b7;--ck-zero:#52514e;--ck-shade:#f2f1ec;--ck-track:#efeee9;--ck-area:.2;--ck-border:rgba(11,11,11,.09);--ck-chip:rgba(11,11,11,.13);--ck-hover:rgba(11,11,11,.05);--ck-tip-bg:#ffffff;--ck-tip-border:rgba(11,11,11,.10);--ck-shadow:rgba(11,11,11,.16);--ck-cross:#a8a79f;--ck-s1:#2a78d6;--ck-s2:#eb6834;--ck-s3:#1baf7a;--ck-s4:#eda100;--ck-s5:#e87ba4;--ck-s6:#008300;--ck-s7:#6250d6;--ck-s8:#e34948;font-family:Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;-webkit-font-smoothing:antialiased}
