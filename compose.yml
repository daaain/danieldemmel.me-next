# Next.js dev server, driven by foldyard (`fy up`, `fy logs app`, `fy open`).
# Proxy + CA settings (HTTP(S)_PROXY, NO_PROXY, NODE_EXTRA_CA_CERTS, the CA mount) come from foldyard
# in every container while the VM firewall is on — do not restate them here (`fy docs networking`).
services:
  app:
    image: node:24-trixie-slim
    working_dir: /app
    command: sh -c "yarn install --frozen-lockfile && yarn dev -H 0.0.0.0 -p 3000"
    ports:
      - "${APP_PORT:-3210}:3000"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      # Edits made on the host don't reliably raise inotify events through the VM mount
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next:/app/.next
      - contentlayer:/app/.contentlayer
      - yarn_cache:/usr/local/share/.cache/yarn

volumes:
  node_modules:
  next:
  contentlayer:
  yarn_cache:
